[package]
name = "nexa"
version = "1.0.0"
edition = "2021"
authors = ["NEXA Core Team"]
description = "The NEXA Systems & General-Purpose Programming Language"
license = "MIT"
homepage = "https://github.com/NEXA-New-Language/nexa"
repository = "https://github.com/NEXA-New-Language/nexa"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[profile.release]
# Release builds are what users install: squeeze the compiler itself.
opt-level = 3
lto = true
codegen-units = 1
strip = true
